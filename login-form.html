<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  form {
    background: #ffffff;
    padding: 2.5rem 2rem;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    width: 100%;
    max-width: 360px;
  }

  form h1 {
    margin: 0 0 1.5rem;
    font-size: 1.5rem;
    text-align: center;
    color: #1f2937;
  }

  .field {
    margin-bottom: 1.25rem;
  }

  label {
    display: block;
    margin-bottom: 0.4rem;
    font-size: 0.9rem;
    font-weight: 600;
    color: #374151;
  }

  input[type="text"],
  input[type="password"] {
    width: 100%;
    padding: 0.65rem 0.8rem;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 0.95rem;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  input[type="text"]:focus,
  input[type="password"]:focus {
    outline: none;
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
  }

  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 1.25rem;
  }

  .checkbox-row label {
    margin: 0;
    font-weight: 400;
    color: #4b5563;
  }

  .radio-group {
    display: flex;
    gap: 1.5rem;
    margin-bottom: 1.5rem;
  }

  .radio-option {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.9rem;
    color: #4b5563;
  }

  .radio-option label {
    margin: 0;
    font-weight: 400;
  }

  input[type="checkbox"],
  input[type="radio"] {
    accent-color: #6366f1;
    width: 16px;
    height: 16px;
    cursor: pointer;
  }

  .actions {
    display: flex;
    gap: 0.75rem;
  }

  button {
    flex: 1;
    padding: 0.7rem;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
  }

  button:active {
    transform: scale(0.97);
  }

  button[type="submit"] {
    background: #6366f1;
    color: #ffffff;
  }

  button[type="submit"]:hover {
    background: #4f46e5;
  }

  button[type="reset"] {
    background: #f3f4f6;
    color: #374151;
  }

  button[type="reset"]:hover {
    background: #e5e7eb;
  }
</style>
</head>
<body>

<form action="server-endpoint" method="POST">
  <h1>Sign in</h1>

  <div class="field">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" placeholder="Enter your username">
  </div>

  <div class="field">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="Enter your password">
  </div>

  <div class="checkbox-row">
    <input type="checkbox" id="remember" name="remember">
    <label for="remember">Remember me</label>
  </div>

  <div class="field">
    <label>Gender</label>
    <div class="radio-group">
      <div class="radio-option">
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
      </div>
      <div class="radio-option">
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
      </div>
    </div>
  </div>

  <div class="actions">
    <button type="submit">Login</button>
    <button type="reset">Reset</button>
  </div>
</form>

</body>
</html>
